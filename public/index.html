function meTone(freq=660,duration=.11,delay=0){
 if(!meSoundOn)return;
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;meAudioContext??=new C();if(meAudioContext.state==='suspended')meAudioContext.resume();const osc=meAudioContext.createOscillator(),gain=meAudioContext.createGain(),t=meAudioContext.currentTime+delay;osc.type='sine';osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(meAudioContext.destination);osc.start(t);osc.stop(t+duration+.02)}catch(e){}
}
function meChime(type='ok'){
 if(type==='try'){meTone(420,.16);meTone(520,.18,.17)}
 else if(type==='win'){[523,659,784,1046].forEach((n,i)=>meTone(n,.2,i*.13))}

}
function meCelebrate(message='Muito bem! ⭐',count=12){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const old=document.querySelector('.me-fx-toast');old?.remove();
 const toast=document.createElement('div');toast.className='me-fx-toast';toast.textContent=message;document.body.append(toast);setTimeout(()=>toast.remove(),2100);
 const layer=document.createElement('div');layer.className='me-fx-layer';document.body.append(layer);
 const icons=['⭐','✨','🌟','🎉','💛'];
 for(let i=0;i<count;i++){const star=document.createElement('span');star.className='me-fx-star';star.textContent=icons[i%icons.length];star.style.left=(20+Math.random()*60)+'%';star.style.top=(35+Math.random()*35)+'%';star.style.setProperty('--dx',((Math.random()-.5)*250)+'px');star.style.setProperty('--dy',(-70-Math.random()*230)+'px');star.style.animationDelay=(Math.random()*.22)+'s';layer.append(star)}
 setTimeout(()=>layer.remove(),1900)
}
